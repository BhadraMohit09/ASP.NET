<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
</head>

<body class="d-flex justify-content-center">
    <div class="container shadow bg-light">
        <div class="row">
            <div class="col bg-info p-5 d-flex justify-content-center">
                <img src="./logo.png" width="60">
            </div>
        </div>
        <div class="row">
            <div class="col p-4">
                <div class="text-center mb-3">
                    <h4>Order/delivery Tracking</h4>
                    <span>Trace Your order</span>
                </div>

                <h6 class="text-info">Personal information</h6>
                <hr class="border border-1 border-info" />

                <form>
                    <div class="row p-2">
                        <div class="col w-100">
                            <label class="col-5">Name<span class="text-danger">*</span></label>
                            <input class="border rounded col-6">
                        </div>
                    </div>
                    <div class="row p-2">
                        <div class="col w-100">
                            <label class="col-5">Email<span class="text-danger">*</span></label>
                            <input class="border rounded col-6">
                        </div>
                    </div>
                    <div class="row p-2">
                        <div class="col w-100">
                            <label class="col-5">Contact number<span class="text-danger">*</span></label>
                            <input class="border rounded col-6">
                        </div>
                    </div>
                </form>

                <h6 class="text-info mt-5">Order information</h6>
                <hr class="border border-1 border-info" />

                <form>
                    <div class="row">
                        <div class="col w-100">
                            <label class="col-5">Order Id<span class="text-danger">*</span></label>
                            <input class="border rounded col-6">
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-5">
                            <label>Delivery destination<span class="text-danger">*</span></label>
                        </div>
                        <div class="col-6">
                            <input type="text" class="border rounded" id="streetaddress" aria-describedby="emailHelp">
                            <div id="streetaddress" class="form-text mb-3">Street Address</div>

                            <input type="text" class="border rounded" id="streetaddress2" aria-describedby="emailHelp">
                            <div id="streetaddress2" class="form-text">Address Line 2</div>

                           <div class="row">
                            <div class="col mt-3">
                                <input class="border rounded col-4">
                                <input class="border rounded col-4">
                             </div>
                           </div>

                           <div class="row">
                            <div class="col mt-3">
                                <input class="border rounded col-4">
                                <input class="border rounded col-4">
                             </div>
                           </div>
                        </div>
                    </div>
                    <div class="row p-2">
                        <div class="col w-100">
                            <label class="col-5">When did you place your order ?<span class="text-danger">*</span></label>
                            <input class="border rounded col-6">
                        </div>
                    </div>

                    <div class="text-center">
                        <button class="bg-primary text-light border p-2 rounded mt-5 w-25">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>l
