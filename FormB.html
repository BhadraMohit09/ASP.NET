<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
  <div class="bg-info p-5">
    <div class=" border bg-white pb-2">
      <div class="row px-4">
        <h1>Registation</h1>
      </div>
      <div class=" px-4">
        <div class="row ">
          <div class="row mt-3">
            <h5 class="text-secondary">Personal Details</h5>
          </div>
          <div class="row">
            <div class="col-3">
              <div class="row">FullName</div>
              <div class="row mt-1 ">
                <input type="text" class="p-1 border border-secondary rounded" placeholder="enter your name">
              </div>
            </div>
            <div class="col-3 ms-5">
              <div class="row">Dath of Birth</div>
              <div class="row mt-1">
                <input type="text" class="p-1" placeholder="enter your date">
              </div>
            </div>
            <div class="col-3 ms-5">
              <div class="row">Email</div>
              <div class="row mt-1">
                <input type="email" class="p-1" placeholder="enter your email">
              </div>
            </div>
          </div>
        </div>
        <div class="row mt-3">
          <div class="row">
            <div class="col-3">
              <div class="row">Mobile number</div>
              <div class="row mt-1">
                <input type="text" class="p-1" placeholder="enter your number">
              </div>
            </div>
            <div class="col-3 ms-5">
              <div class="row">Gender</div>
              <div class="row mt-1">
                <input type="text" class="p-1" placeholder="enter your gender">
              </div>
            </div>
            <div class="col-3 ms-5">
              <div class="row">Occupation</div>
              <div class="row mt-1">
                <input type="email" class="p-1" placeholder="enter your Occupation">
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="px-4">
        <div class="row">
          <div class="row mt-3">
            <h5 class="text-secondary">Identity Details</h5>
          </div>
          <div class="row">
            <div class="col-3 ">
              <div class="row">Id type</div>
              <div class="row">
                <input class="p-1" type="text" placeholder="enter id type">
              </div>
            </div>
            <div class="col-3 ms-5">
              <div class="row">Id Number</div>
              <div class="row">
                <input class="p-1" type="text" placeholder="enter id number">
              </div>
            </div>
            <div class="col-3 ms-5">
              <div class="row">Issue Authority</div>
              <div class="row">
                <input class="p-1" type="email" placeholder="enter issue department">
              </div>
            </div>
          </div>
        </div>
        <div class="row mt-3">
          <div class="row">
            <div class="col-3">
              <div class="row">Issue Date</div>
              <div class="row">
                <input type="text" class="p-1" placeholder="enter id issue date">
              </div>
            </div>
            <div class="col-3 ms-5">
              <div class="row">Issue Date</div>
              <div class="row">
                <input type="text" class="p-1" placeholder="enter id issue date">
              </div>
            </div>
            <div class="col-3 ms-5">
              <div class="row">Expiry Date</div>
              <div class="row">
                <input type="email" class="p-1" placeholder="enter your expiry date">
              </div>
            </div>
          </div>

        </div>
      </div>
      <div class="container row px-4 mt-4">
        <button class=" btn btn-primary w-25 px-5">Next
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-right"
            viewBox="0 0 16 16">
            <path fill-rule="evenodd"
              d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8z" />
          </svg>
        </button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>
</html>
