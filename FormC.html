<html>

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .c1 {
            background-color: rgb(145, 236, 239);
        }
        
    </style>
</head>

<body>
    <div class="c1 p-5">
        <div class="col ">
            <div class="row text-center pt-3  ">
                <h3>Student Registeration Form</h3>
            </div>
            <hr class="border border-dark ">
            <form>
                <div class="mb-3">
                    <label for="FirstName" class="form-label">FirstName</label>
                    <input type="text" class="form-control" id="FirstName" placeholder="FirstName">
                </div>
                <div class="mb-3">
                    <label for="Middlename" class="form-label">Middlename</label>
                    <input type="text" class="form-control" id="Middlename" placeholder="Middlename">
                </div>
                <div class="mb-3">
                    <label for="LastName" class="form-label">LastName</label>
                    <input type="text" class="form-control" id="LastName" placeholder="LastName">
                </div>
                <div class="btn-group my-2" role="group">
                    <label for="Course">Course: </label>
                    <button type="button" class=" dropdown-toggle ms-2" data-bs-toggle="dropdown" aria-expanded="false">
                        Course
                    </button>
                    <ul class="dropdown-menu bg-light">
                        <li><a class="dropdown-item" href="#">Asp.net</a></li>
                        <li><a class="dropdown-item" href="#">Data Mining</a></li>
                    </ul>
                </div>
                <div class="my-2">
                    <label for="Course">Gender: </label>
                    <div class="form-check form-check-inline ms-2">
                        <input class="form-check-input" type="radio" id="radio1" name="radio" checked>
                        <label class="form-check-label" for="radio1">Male</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="radio2" name="radio" checked>
                        <label class="form-check-label" for="radio2">Female</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="radio3" name="radio" checked>
                        <label class="form-check-label" for="radio3">Other</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Phone:</label>
                    <input type="number" class="form-control" id="phone" placeholder="+91" />
                </div>
                <div class="mb-3">
                    <input type="number" class="form-control" id="phone" placeholder="Phone no">
                </div>
                <div class="form-group">
                    <label for="exampleFormControlTextarea1">Current Address :</label>
                    <textarea class="form-control" id="exampleFormControlTextarea1" rows="3" placeholder="Current Address"></textarea>
                </div>
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label ">Email </label>
                    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Email ">
                </div>
                <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label ">Password</label>
                    <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Password">
                </div>
                <div class="mb-3">
                    <label for="exampleInputPassword2" class="form-label ">Re-Type Password</label>
                    <input type="password" class="form-control" id="exampleInputPassword2" placeholder="Re-Type Password">
                </div>
               
                <div class="row p-2">
                    <button type="submit" class="btn btn-success ">Register</button>
                </div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
